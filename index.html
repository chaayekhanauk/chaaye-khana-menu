<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Chaayé Khana · Menu</title>
<meta name="description" content="Chaayé Khana — Tea Beyond Borders. Breakfast, plates, desserts and chaayé. Colliers Wood, London.">
<meta name="theme-color" content="#e9dcc0">
<style>
  :root{ --paper:#e7d9bc; --ink:#2c2016; --terra:#b8472a; --brass:#a8842c; }
  *{box-sizing:border-box;margin:0;padding:0}
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:var(--paper);
    background-image:
      radial-gradient(120% 80% at 50% 0%, rgba(255,250,238,.55), transparent 60%),
      radial-gradient(120% 120% at 100% 100%, rgba(150,118,70,.18), transparent 55%);
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
  }
  .menu{ max-width:560px; margin:0 auto; padding:14px 12px 40px; display:flex; flex-direction:column; gap:14px; }
  .page{
    display:block; width:100%; height:auto; aspect-ratio:1280 / 2133;
    border-radius:3px;
    box-shadow:0 6px 22px rgba(58,40,18,.22), 0 1px 3px rgba(58,40,18,.18);
    background:#f3ead6; cursor:zoom-in;
  }

  /* ---- Splash ---- */
  #splash{
    position:fixed; inset:0; z-index:60;
    background:var(--paper);
    background-image:radial-gradient(120% 90% at 50% 30%, rgba(255,250,238,.6), transparent 65%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; transition:opacity .6s ease; padding:24px;
  }
  #splash.hide{ opacity:0; pointer-events:none; }
  .splash-urdu{
    font-family:"Noto Nastaliq Urdu","Scheherazade New",serif;
    direction:rtl; color:var(--terra); font-size:1.7rem; line-height:1; margin-bottom:14px;
  }
  .splash-word{
    font-family:"Playfair Display",Georgia,"Times New Roman",serif;
    font-weight:700; letter-spacing:.16em; text-transform:uppercase;
    font-size:1.9rem; color:var(--ink);
  }
  .splash-tag{
    margin-top:14px; font-size:.66rem; letter-spacing:.34em; text-transform:uppercase; color:var(--brass);
  }
  .splash-dots{ margin-top:22px; display:flex; gap:7px; }
  .splash-dots span{
    width:7px; height:7px; border-radius:50%; background:var(--terra); opacity:.3;
    animation:pulse 1.1s infinite ease-in-out;
  }
  .splash-dots span:nth-child(2){ animation-delay:.18s; }
  .splash-dots span:nth-child(3){ animation-delay:.36s; }
  @keyframes pulse{ 0%,100%{opacity:.25;transform:scale(.85)} 50%{opacity:1;transform:scale(1)} }
  @media (prefers-reduced-motion:reduce){ .splash-dots span{animation:none} #splash{transition:none} }

  /* ---- Zoom hint ---- */
  #hint{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(8px);
    z-index:45; background:rgba(44,32,22,.9); color:#f3ead6;
    font-size:.82rem; letter-spacing:.02em; padding:9px 16px; border-radius:999px;
    box-shadow:0 4px 14px rgba(0,0,0,.3); opacity:0; transition:opacity .4s ease, transform .4s ease;
    pointer-events:none; white-space:nowrap;
  }
  #hint.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---- Zoom viewer ---- */
  .viewer{ position:fixed; inset:0; z-index:50; background:rgba(28,20,12,.92); display:none; overflow:auto; -webkit-overflow-scrolling:touch; text-align:center; }
  .viewer.open{ display:block; }
  .viewer img{ width:auto; max-width:none; display:inline-block; cursor:zoom-out; }
  .viewer-close{ position:fixed; top:14px; right:14px; z-index:51; width:42px; height:42px; border-radius:50%; border:none; background:rgba(243,234,214,.92); color:var(--ink); font-size:22px; line-height:42px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.3); }

  /* ---- Back to top ---- */
  .totop{ position:fixed; right:16px; bottom:16px; z-index:40; width:46px; height:46px; border-radius:50%; border:none; background:var(--terra); color:#fff; font-size:20px; line-height:46px; cursor:pointer; box-shadow:0 4px 14px rgba(58,40,18,.35); opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .totop.show{ opacity:1; pointer-events:auto; }
  .totop:focus-visible,.viewer-close:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
</style>
</head>
<body>

<div id="splash">
  <div class="splash-urdu">چائے خانہ</div>
  <div class="splash-word">Chaayé Khana</div>
  <div class="splash-tag">Tea Beyond Borders</div>
  <div class="splash-dots"><span></span><span></span><span></span></div>
</div>

<main class="menu" id="menu">
  <img class="page" src="pages/01.jpg" alt="Chaayé Khana menu — cover" width="1280" height="2133" fetchpriority="high" decoding="async">
  <img class="page" src="pages/02.jpg" alt="Chaayé Khana menu — page 2 of 15" width="1280" height="2133" loading="lazy" decoding="async">
  <img class="page" src="pages/03.jpg" alt="Chaayé Khana menu — page 3 of 15" width="1280" height="2133" loading="lazy" decoding="async">
  <img class="page" src="pages/04.jpg" alt="Chaayé Khana menu — page 4 of 15" width="1280" height="2133" loading="lazy" decoding="async">
  <img class="page" src="pages/05.jpg" alt="Chaayé Khana menu — page 5 of 15" width="1280" height="2133" loading="lazy" decoding="async">
  <img class="page" src="pages/06.jpg" alt="Chaayé Khana menu — page 6 of 15" width="1280" height="2133" loading="lazy" decoding="async">
  <img class="page" src="pages/07.jpg" alt="Chaayé Khana menu — page 7 of 15" width="1280" height="2133" loading="lazy" decoding="async">
  <img class="page" src="pages/08.jpg" alt="Chaayé Khana menu — page 8 of 15" width="1280" height="2133" loading="lazy" decoding="async">
  <img class="page" src="pages/09.jpg" alt="Chaayé Khana menu — page 9 of 15" width="1280" height="2133" loading="lazy" decoding="async">
  <img class="page" src="pages/10.jpg" alt="Chaayé Khana menu — page 10 of 15" width="1280" height="2133" loading="lazy" decoding="async">
  <img class="page" src="pages/11.jpg" alt="Chaayé Khana menu — page 11 of 15" width="1280" height="2133" loading="lazy" decoding="async">
  <img class="page" src="pages/12.jpg" alt="Chaayé Khana menu — page 12 of 15" width="1280" height="2133" loading="lazy" decoding="async">
  <img class="page" src="pages/13.jpg" alt="Chaayé Khana menu — page 13 of 15" width="1280" height="2133" loading="lazy" decoding="async">
  <img class="page" src="pages/14.jpg" alt="Chaayé Khana menu — page 14 of 15" width="1280" height="2133" loading="lazy" decoding="async">
  <img class="page" src="pages/15.jpg" alt="Chaayé Khana menu — page 15 of 15" width="1280" height="2133" loading="lazy" decoding="async">
</main>

<div id="hint">Tap any page to zoom</div>
<button class="totop" id="totop" aria-label="Back to top">↑</button>

<div class="viewer" id="viewer" role="dialog" aria-label="Zoomed menu page">
  <button class="viewer-close" id="viewerClose" aria-label="Close">×</button>
  <img id="viewerImg" src="" alt="">
</div>

<script>
  var splash = document.getElementById('splash');
  var hint = document.getElementById('hint');
  function dropSplash(){
    if(splash.classList.contains('hide')) return;
    splash.classList.add('hide');
    setTimeout(function(){ if(splash && splash.parentNode){ splash.parentNode.removeChild(splash); } }, 650);
    setTimeout(function(){ hint.classList.add('show'); }, 700);
    setTimeout(function(){ hint.classList.remove('show'); }, 4200);
  }
  window.addEventListener('load', function(){ setTimeout(dropSplash, 600); });
  setTimeout(dropSplash, 2200);

  var viewer = document.getElementById('viewer');
  var viewerImg = document.getElementById('viewerImg');
  var viewerClose = document.getElementById('viewerClose');
  document.querySelectorAll('.page').forEach(function(img){
    img.addEventListener('click', function(){
      viewerImg.src = img.currentSrc || img.src;
      viewerImg.alt = img.alt;
      viewer.classList.add('open');
      viewer.scrollTop = 0;
      document.body.style.overflow = 'hidden';
      hint.classList.remove('show');
    });
  });
  function closeViewer(){ viewer.classList.remove('open'); viewerImg.src=''; document.body.style.overflow=''; }
  viewer.addEventListener('click', function(e){ if(e.target !== viewerClose) closeViewer(); });
  viewerClose.addEventListener('click', closeViewer);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeViewer(); });

  var totop = document.getElementById('totop');
  window.addEventListener('scroll', function(){
    if(window.scrollY > 700){ totop.classList.add('show'); } else { totop.classList.remove('show'); }
  }, {passive:true});
  totop.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });
</script>

</body>
</html>
